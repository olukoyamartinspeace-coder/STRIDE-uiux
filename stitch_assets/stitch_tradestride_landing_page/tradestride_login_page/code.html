<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>TradeStride Login Page</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#195de6",
              "background-light": "#f6f6f8",
              "background-dark": "#111621",
            },
            fontFamily: {
              "display": ["Inter", "sans-serif"]
            },
            borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="font-display">
<div class="relative flex min-h-screen w-full flex-col bg-background-light dark:bg-background-dark group/design-root" style='font-family: "Inter", "Noto Sans", sans-serif;'>
<div class="flex flex-1">
<div class="flex w-full">
<!-- Left Panel -->
<div class="relative hidden w-1/2 flex-col items-center justify-center bg-gray-100 dark:bg-gray-900/50 lg:flex">
<div class="w-full h-full bg-center bg-no-repeat bg-cover" data-alt="A modern, well-lit warehouse with organized shelves and pallets, representing commerce and logistics." style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuBfN-n1v2ZWaPnmMoxcyxUXByO8fqcVV0DAiK-xBEZn4EiSnj5Lcea64YL45zrz1NbQacLVz_VGUOjMKad6sntFqfLcBuRPMUFoUMWddmGG9ZlyRzlQMZ87YuB1n6umrpcyYknb_ohM79PAikRu4zAHVifo9CB7xfPnUv3M196XzvR6vZLTJ_gNXBh2FdCQatLZVibvgewwVAA7nWDy-kOROdLq8T8JL-B0Z-M1AqTNqJzLN7gEOeS2nfCohcFr5Oyqe-PAVTeATEA");'></div>
<div class="absolute inset-0 bg-gradient-to-t from-black/60 to-transparent"></div>
<div class="absolute bottom-0 left-0 p-12 text-white">
<h1 class="text-5xl font-black leading-tight tracking-[-0.033em]">The Future of Wholesale Commerce</h1>
<h2 class="mt-2 text-lg font-normal leading-normal text-gray-200">Connecting verified wholesalers and retailers securely.</h2>
</div>
</div>
<!-- Right Panel -->
<div class="flex flex-1 items-center justify-center p-6 sm:p-8 lg:w-1/2">
<div class="flex w-full max-w-md flex-col gap-8">
<!-- Header -->
<div class="flex flex-col items-start gap-4">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary text-3xl">storefront</span>
<h3 class="text-2xl font-bold text-slate-900 dark:text-white">TradeStride</h3>
</div>
<div class="flex flex-col gap-2">
<h2 class="text-3xl font-bold tracking-tight text-slate-900 dark:text-white">Welcome back</h2>
<p class="text-sm text-slate-600 dark:text-slate-400">Log in to your account to continue.</p>
</div>
</div>
<!-- Form -->
<div class="flex w-full flex-col gap-6">
<div class="flex flex-col gap-4">
<!-- Email Input -->
<label class="flex flex-col min-w-40 flex-1">
<p class="text-[#111318] dark:text-slate-200 text-sm font-medium leading-normal pb-2">Email address</p>
<div class="flex w-full flex-1 items-stretch rounded-lg">
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-[#111318] dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-[#dcdfe5] dark:border-slate-700 bg-white dark:bg-background-dark focus:border-primary h-12 placeholder:text-[#636f88] px-4 text-base font-normal leading-normal" placeholder="Enter your email" value=""/>
</div>
</label>
<!-- Password Input -->
<label class="flex flex-col min-w-40 flex-1">
<p class="text-[#111318] dark:text-slate-200 text-sm font-medium leading-normal pb-2">Password</p>
<div class="flex w-full flex-1 items-stretch rounded-lg group">
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-l-lg text-[#111318] dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-[#dcdfe5] dark:border-slate-700 bg-white dark:bg-background-dark focus:border-primary h-12 placeholder:text-[#636f88] p-[15px] border-r-0 text-base font-normal leading-normal" placeholder="Enter your password" type="password" value=""/>
<div class="text-[#636f88] dark:text-slate-400 flex border border-[#dcdfe5] dark:border-slate-700 bg-white dark:bg-background-dark group-focus-within:ring-2 group-focus-within:ring-primary/50 group-focus-within:border-primary items-center justify-center pr-[15px] rounded-r-lg border-l-0 cursor-pointer">
<span class="material-symbols-outlined">visibility</span>
</div>
</div>
</label>
</div>
<!-- Forgot Password Link -->
<a class="text-primary text-sm font-normal leading-normal text-right underline" href="#">Forgot password?</a>
<!-- Login Button -->
<button class="flex min-w-[84px] w-full cursor-pointer items-center justify-center overflow-hidden rounded-lg h-12 px-5 bg-primary text-white text-base font-bold leading-normal tracking-[0.015em] hover:bg-primary/90 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary dark:focus:ring-offset-background-dark">
<span class="truncate">Log In</span>
</button>
<!-- Sign Up Link -->
<p class="text-[#636f88] dark:text-slate-400 text-sm font-normal leading-normal text-center">
                                Don't have an account? <a class="text-primary underline font-medium" href="#">Sign up</a>
</p>
</div>
</div>
</div>
</div>
</div>
</div>
</body></html>
